process: task_lifecycle
title: Жизненный цикл задачи
class: task
create_roles: [analyst, pm]

actions:
  - id: analyze
    title: Взять в анализ

  - id: start_dev
    title: Начать разработку

  - id: submit_review
    title: Отправить на ревью

  - id: approve
    title: Одобрить

  - id: reject
    title: Вернуть

  - id: pass_test
    title: Тест пройден

  - id: fail_test
    title: Тест не пройден

  - id: cancel
    title: Отменить

predicates:
  - id: has_title
    parameter: title
    operator: filled

  - id: has_description
    parameter: description
    operator: filled

  - id: priority_in_range
    parameter: priority
    operator: in_range

  - id: estimated_filled
    parameter: estimated_hours
    operator: filled

  - id: estimated_in_range
    parameter: estimated_hours
    operator: in_range

  - id: high_priority
    parameter: priority
    operator: "<="
    value: 2

  - id: small_task
    parameter: estimated_hours
    operator: "<="
    value: 4

states:
  - id: backlog
    title: Бэклог
    initial: true
    roles: [analyst, pm]

  - id: analysis
    title: Анализ
    roles: [analyst]

  - id: development
    title: Разработка
    roles: [developer]

  - id: review
    title: Ревью
    roles: [developer]

  - id: testing
    title: Тестирование
    roles: [tester]

  - id: done
    title: Выполнено
    final: true

  - id: cancelled
    title: Отменено
    final: true

transitions:
  - from: backlog
    action: analyze
    to: analysis

  - from: backlog
    action: cancel
    to: cancelled

  - from: analysis
    action: start_dev
    to: development
    condition:
      - [has_title, has_description, priority_in_range, estimated_filled, estimated_in_range]

  - from: analysis
    action: reject
    to: backlog

  - from: development
    action: submit_review
    to: review

  - from: development
    action: cancel
    to: cancelled

  # Быстрый трек: высокий приоритет И малая задача → сразу done
  - from: review
    action: approve
    to: done
    condition:
      - [high_priority, small_task]

  # Обычный трек: НЕ высокий приоритет ИЛИ НЕ малая задача → тестирование
  - from: review
    action: approve
    to: testing
    condition:
      - [not high_priority]
      - [not small_task]

  - from: review
    action: reject
    to: development

  - from: testing
    action: pass_test
    to: done

  - from: testing
    action: fail_test
    to: development
