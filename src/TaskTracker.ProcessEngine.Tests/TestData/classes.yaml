classes:
  - id: task
    title: Задача
    parameters:
      - id: title
        title: Название
        type: string
      - id: description
        title: Описание
        type: string
      - id: priority
        title: Приоритет
        type: integer
        min: 1
        max: 5
      - id: estimated_hours
        title: Оценка трудозатрат (ч)
        type: decimal
        min: 0.5
        max: 1000

  - id: bug
    title: Баг
    parent: task
    parameters:
      - id: priority
        title: Приоритет
        type: integer
        min: 1
        max: 3
      - id: severity
        title: Критичность
        type: integer
        min: 1
        max: 5
      - id: steps_to_reproduce
        title: Шаги воспроизведения
        type: string

  - id: feature
    title: Фича
    parent: task
    parameters:
      - id: story_points
        title: Story Points
        type: integer
        min: 1
        max: 21
