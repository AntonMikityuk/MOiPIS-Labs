process: ambiguous_test
title: Тест неоднозначности
class: task
create_roles: [analyst, pm]

actions:
  - id: proceed
    title: Продолжить

predicates:
  - id: has_title
    parameter: title
    operator: filled
    
  - id: priority_in_range
    parameter: priority
    operator: in_range

states:
  - id: start
    title: Начало
    initial: true
    roles: [analyst, pm]
    edit_parameters: true
    
  - id: path_a
    title: Путь А
    final: true
    
  - id: path_b
    title: Путь Б
    final: true

transitions:
  - from: start
    action: proceed
    to: path_a
    condition:
      - [has_title]
  
  - from: start
    action: proceed
    to: path_b
    condition:
      - [has_title, priority_in_range]
